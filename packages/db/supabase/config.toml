# Local stack only. Ports are 553xx so this can run next to other Supabase projects on the same machine.
project_id = "flake"

[api]
enabled = true
port = 55321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://localhost:3100/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false
# Account, Connect Microsoft or Google: links a provider to the signed-in account (issue 242, docs/SSO_SETUP.md).
enable_manual_linking = true
# A password is optional (Account, Password); the app asks for 8 too.
minimum_password_length = 8

# Microsoft and Google sign-in (issue 242). Off locally: there are no provider apps for localhost. The e2e run shows the
# buttons with SSO_PROVIDERS instead. To try one locally, register an app per docs/SSO_SETUP.md and uncomment:
# [auth.external.azure]
# enabled = true
# client_id = "env(SUPABASE_AUTH_AZURE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_AZURE_SECRET)"
# url = "https://login.microsoftonline.com/common/v2.0"
# [auth.external.google]
# enabled = true
# client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
max_frequency = "1s"

# The code matters on iPhone: a Home Screen app doesn't share sign-in with Safari, where the link opens.
[auth.email.template.magic_link]
subject = "Your Flake sign-in"
content_path = "./supabase/templates/magic_link.html"

# A first sign-in sends this one instead of the magic link. It needs the code too (issue 1).
[auth.email.template.confirmation]
subject = "Your Flake sign-in"
content_path = "./supabase/templates/confirmation.html"

[auth.rate_limit]
email_sent = 1000
sign_in_sign_ups = 1000
token_verifications = 1000

[edge_runtime]
enabled = false

[analytics]
enabled = false
